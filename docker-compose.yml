services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lumina_dev_2024
      POSTGRES_DB: lumina_host
    volumes:
      - lumina_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  lumina_postgres_data:

networks:
  default:
    name: lumina-network
